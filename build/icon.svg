<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6f8e"/>
      <stop offset="1" stop-color="#d63860"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3edde"/>
    </linearGradient>
  </defs>

  <!-- 樱桃红圆角底（手办风，奶油描边） -->
  <rect x="14" y="14" width="484" height="484" rx="118" fill="url(#bg)" stroke="#fff2d3" stroke-width="18"/>

  <!-- 骰子底部投影 -->
  <ellipse cx="250" cy="426" rx="200" ry="32" fill="rgba(116,20,48,0.35)"/>

  <!-- 白色骰子（微旋转，带厚度底块） -->
  <g transform="rotate(-8 250 240)">
    <rect x="102" y="94" width="300" height="300" rx="78" fill="#c23557"/>
    <rect x="92" y="84" width="300" height="300" rx="78" fill="url(#die)" stroke="#efe7d4" stroke-width="3"/>
    <!-- 5 个点 -->
    <circle cx="166" cy="158" r="38" fill="#f05278"/>
    <circle cx="334" cy="158" r="38" fill="#f05278"/>
    <circle cx="250" cy="234" r="38" fill="#f05278"/>
    <circle cx="166" cy="310" r="38" fill="#f05278"/>
    <circle cx="334" cy="310" r="38" fill="#f05278"/>
  </g>

  <!-- 金色铜钱（方孔，叠于骰子右下） -->
  <circle cx="414" cy="424" r="78" fill="#8f5b14"/>
  <path fill-rule="evenodd" fill="#f3b83f" stroke="#c98f22" stroke-width="8"
    d="M410 344 a78 78 0 1 1 0 156 a78 78 0 1 1 0 -156 M386 398 h48 v52 h-48 z"/>
</svg>
